<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio Sellado</title>
<meta name="description" content="Juego de escape de estequiometría para Composición de la Materia: siete salas selladas, de la ecuación química al reactivo limitante.">
<style>
:root{
  --bg:#0b0d0e;--bg2:#121516;--panel:#171b1c;--panel2:#1e2324;--line:#2f3638;--line2:#414a4c;
  --ink:#d5d8d2;--muted:#8d9591;--amber:#e3a630;--amber2:#a8781c;--red:#c4433a;--red2:#6e211c;--ok:#7fb486;--okbg:#1b2a1e;--badbg:#2c1715;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --math:"Cambria Math","STIX Two Math","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;transition:box-shadow .6s;
  box-shadow:inset 0 0 120px rgba(0,0,0,.85)}
body.gas-mid::after{box-shadow:inset 0 0 140px rgba(110,33,28,.75)}
body.gas-high::after{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 140px rgba(150,30,25,.7)}50%{box-shadow:inset 0 0 200px rgba(196,67,58,.95)}}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:44px;touch-action:manipulation}
button:hover:not(:disabled){border-color:var(--amber2)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--amber);color:#1b1404;border-color:var(--amber);font-weight:700}
button.pri:hover:not(:disabled){background:#f0b847}
button.ghost{background:transparent}
button.danger{background:var(--red2);border-color:var(--red)}
input{font:inherit;font-family:var(--mono);color:var(--ink);background:#0e1112;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;min-height:44px;width:9em;max-width:100%}
input:focus{outline:2px solid var(--amber);outline-offset:1px}
input.bad{border-color:var(--red);background:var(--badbg)}
input.good{border-color:var(--ok);background:var(--okbg)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.mono{font-family:var(--mono)}
.chem{font-family:var(--math);font-size:1.08em;white-space:nowrap}
sub,sup{font-size:.72em;line-height:0}
.st{font-size:.8em;color:var(--muted)}
h1,h2,h3{font-family:var(--mono);letter-spacing:.04em;font-weight:700;line-height:1.25}
/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(11,13,14,.94);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.top .ttl{font-family:var(--mono);font-size:.82rem;color:var(--amber);letter-spacing:.12em;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gas{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.gas .bar{width:110px;height:10px;border:1px solid var(--line2);border-radius:3px;overflow:hidden;background:#0e1112}
.gas .bar i{display:block;height:100%;background:linear-gradient(90deg,#7a6a2a,var(--amber),var(--red));transition:width .5s}
.gas b{color:var(--ink);min-width:3.2em;text-align:right}
.top button{min-height:38px;padding:5px 10px;font-size:.85rem}
/* portada */
.cover{min-height:calc(100dvh - 20px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px 0}
.logo{width:92px;height:92px;margin-bottom:6px;opacity:.9}
.cover h1{font-size:clamp(1.7rem,6vw,3.1rem);margin:.2em 0;color:#e9ebe6;text-shadow:0 0 18px rgba(227,166,48,.18);animation:flick 6s infinite}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
.cover .sub{font-family:var(--mono);color:var(--amber);letter-spacing:.2em;font-size:.82rem;margin-bottom:22px}
.cover p{max-width:620px;color:#b8bdb6}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:560px;width:100%;margin:10px auto;text-align:left}
.box label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.box input{width:100%;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cover .row{justify-content:center;margin-top:14px}
.small{font-size:.85rem;color:var(--muted)}
.refs{max-width:620px;font-size:.78rem;color:#6f7773;margin-top:22px;text-align:left}
.refs p{margin:.3em 0;padding-left:1.6em;text-indent:-1.6em;color:#6f7773}
/* bitácora */
.log{max-width:720px;margin:24px auto}
.log .paper{background:#d7d3c8;color:#2a2722;border-radius:4px;padding:22px 22px 18px;font-family:var(--mono);font-size:.92rem;box-shadow:0 10px 40px rgba(0,0,0,.6);transform:rotate(-.4deg)}
.log .paper h2{margin-top:0;color:#5a1712;font-size:1.05rem}
.log .paper p{margin:.6em 0}
.stamp{display:inline-block;border:2px solid #8a2a20;color:#8a2a20;padding:2px 8px;transform:rotate(-4deg);font-weight:700;letter-spacing:.1em}
/* mapa */
.mapgrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
@media(min-width:900px){.mapgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2,.card h3{margin:0 0 10px;font-size:1rem;color:var(--amber)}
svg.plan{width:100%;height:auto;display:block}
.plan .rm{cursor:pointer}
.plan .rm.lock{cursor:not-allowed}
.plan text{font-family:var(--mono);fill:var(--ink)}
.plan .cur rect.r{animation:glow 1.8s infinite}
@keyframes glow{50%{stroke:#ffd27a;stroke-width:3}}
.qbar{height:8px;background:#0e1112;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.qbar i{display:block;height:100%;background:var(--ok)}
.quests{list-style:none;margin:0;padding:0}
.quests li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line)}
.quests li:last-child{border-bottom:0}
.quests .ic{width:1.4em;text-align:center;flex:none}
.quests .nm{flex:1}
.quests .tm{font-family:var(--mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.quests li.done .nm{color:var(--muted)}
.quests li.cur .nm{color:var(--amber);font-weight:600}
.quests li.lock .nm{color:#5f6764}
.stats{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin-top:10px}
/* sala */
.roomhead{margin:16px 0 6px}
.roomhead .k{font-family:var(--mono);font-size:.78rem;color:var(--amber);letter-spacing:.15em}
.roomhead h2{margin:.15em 0 .3em;font-size:clamp(1.2rem,3.6vw,1.6rem)}
.roomhead p{margin:0;color:#b4b9b2;max-width:820px}
.roomgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:14px;align-items:start}
@media(min-width:900px){.roomgrid.tools-on{grid-template-columns:minmax(0,1fr) 360px}.roomgrid aside{position:sticky;top:64px}}
aside:empty{display:none}
details.note{background:#d7d3c8;color:#26231e;border-radius:6px;padding:0;margin-bottom:14px}
details.note summary{cursor:pointer;padding:12px 16px;font-family:var(--mono);font-weight:700;color:#5a1712;list-style:none}
details.note summary::before{content:"▸ ";}
details.note[open] summary::before{content:"▾ ";}
details.note .body{padding:0 18px 14px;font-size:.95rem}
details.note .body p,details.note .body li{color:#26231e}
details.note .fm{font-family:var(--math);font-size:1.08rem;background:#ece9e1;border-left:4px solid #8a2a20;padding:8px 12px;margin:8px 0;border-radius:3px;overflow-x:auto}
details.note .fac td.nu{border-color:#26231e}
.puz .ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.8rem;color:var(--muted);margin-bottom:8px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:2px;border:1px solid var(--line2);background:#0e1112}
.dots i.ok{background:var(--ok);border-color:var(--ok)}
.dots i.ko{background:var(--red);border-color:var(--red)}
.dots i.now{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.puz h3{color:var(--ink);font-family:system-ui,sans-serif;letter-spacing:0;font-size:1.05rem;margin:0 0 6px}
.ptext{font-size:1.02rem;margin-bottom:12px}
.eqbig{font-family:var(--math);font-size:1.18rem;background:#0e1112;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:nowrap}
.fields{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.fld{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fld .lb{min-width:9.5em;color:#c3c8c1}
.fld .un{color:var(--muted);font-family:var(--mono);font-size:.9rem}
.sci{display:inline-flex;align-items:center;gap:6px;font-family:var(--math);font-size:1.05rem}
.sci input.m{width:6.5em}
.sci input.e{width:4.2em}
.opts{display:grid;gap:8px;margin:10px 0}
.opts button{text-align:left;padding:10px 12px;line-height:1.4}
.opts button.sel-ok{border-color:var(--ok);background:var(--okbg)}
.opts button.sel-ko{border-color:var(--red);background:var(--badbg)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .tool.on{border-color:var(--amber);color:var(--amber)}
.fb{margin-top:12px}
.msg{padding:10px 12px;border-radius:6px;margin:8px 0;border:1px solid var(--line2)}
.msg.ok{background:var(--okbg);border-color:#3f6a47}
.msg.ko{background:var(--badbg);border-color:#7a2b25}
.msg.hint{background:#241e10;border-color:#6c5420}
.sol{background:#0e1112;border-left:4px solid var(--amber);padding:10px 12px;border-radius:4px;margin:8px 0;font-family:var(--math);font-size:1.04rem;line-height:1.75;overflow-x:auto}
.sol b{color:#f2d38f}
/* fracciones y factor unitario (notación de ingeniería) */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .15em;line-height:1.25}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .3em}
.fr>span:last-child{padding:0 .3em}
.fac{border-collapse:collapse;margin:6px 0;font-family:var(--math)}
.fac td{padding:4px 11px;text-align:center;white-space:nowrap}
.fac td.nu{border-bottom:2px solid currentColor}
.fac td.nu+td.nu,.fac td.de+td.de{border-left:2px solid currentColor}
.fac td.rs{font-weight:700;padding-left:12px;vertical-align:middle}
.scroll{overflow-x:auto;max-width:100%}
table.t{border-collapse:collapse;font-family:var(--math);margin:6px 0}
table.t th,table.t td{border:1px solid var(--line2);padding:4px 9px;text-align:center;white-space:nowrap}
table.t th{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);font-weight:600}
/* balanceo */
.bal{margin:8px 0}
.bal .eqrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;background:#0e1112;border:1px solid var(--line);border-radius:8px;padding:10px}
.sp{display:flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:8px;padding:3px}
.sp button{min-height:38px;min-width:36px;padding:0 6px;font-size:1.1rem;line-height:1}
.sp .co{font-family:var(--mono);font-size:1.15rem;color:var(--amber);min-width:1.6em;text-align:center}
.sp .f{font-family:var(--math);font-size:1.15rem;padding:0 6px}
.bal .op{font-family:var(--math);font-size:1.2rem;color:var(--muted)}
table.cnt{border-collapse:collapse;margin-top:10px;font-family:var(--mono);font-size:.92rem}
table.cnt th,table.cnt td{border:1px solid var(--line2);padding:4px 12px;text-align:center}
table.cnt th{color:var(--muted);font-weight:600}
table.cnt tr.eq td{color:var(--ok)}
table.cnt tr.ne td{color:#e3867e}
/* fórmula empírica */
.fe{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;font-family:var(--math);font-size:1.3rem;margin:10px 0}
.fe label{display:inline-flex;align-items:flex-end;gap:2px}
.fe input{width:3.4em;font-size:1rem;padding:6px;min-height:40px;text-align:center}
/* herramientas */
.tool-panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.tool-panel .th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:var(--mono);font-size:.82rem;color:var(--amber)}
.tool-panel .th button{min-height:32px;padding:2px 9px;font-size:.8rem}
.cdisp{background:#c9d3bf;color:#18210f;border-radius:5px;padding:6px 10px;text-align:right;margin-bottom:8px;min-height:64px;border:2px solid #8e9c83}
.cexpr{font-family:var(--math);font-size:1.1rem;word-break:break-all;min-height:1.3em}
.cres{font-family:var(--mono);font-size:1.35rem;font-weight:700;min-height:1.3em}
.ckeys{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.ckeys button{padding:0;min-height:46px;font-size:1.05rem;font-weight:700}
.ckeys button.op{background:#283032}
.ckeys button.del{background:#4b2522;border-color:#7a2b25}
.ckeys button.eq{background:var(--amber);color:#1b1404;border-color:var(--amber);grid-column:span 2}
.ckeys button.use{grid-column:1 / -1;background:#24402a;border-color:#3f6a47;font-size:.9rem;font-weight:600}
.ptab{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:5px}
.ptab div{background:#0e1112;border:1px solid var(--line2);border-radius:5px;padding:5px 4px;text-align:center;line-height:1.2}
.ptab b{display:block;font-size:1.05rem;color:var(--ink)}
.ptab span{font-family:var(--mono);font-size:.8rem;color:var(--amber)}
.ptab small{display:block;font-size:.66rem;color:var(--muted)}
/* overlays de evento (en flujo, no flotantes) */
.event{max-width:720px;margin:28px auto;text-align:center}
.event .big{font-family:var(--mono);font-size:clamp(1.2rem,4.5vw,1.9rem);color:var(--amber);letter-spacing:.08em}
.event.faint .big{color:var(--red)}
.event p{color:#c0c5be}
.report{max-width:640px;margin:22px auto;background:#d7d3c8;color:#26231e;border-radius:4px;padding:22px;font-family:var(--mono)}
.report h2{margin:0 0 6px;color:#5a1712}
.report table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.95rem}
.report td{border-bottom:1px dashed #9a958a;padding:6px 4px}
.report td:last-child{text-align:right;font-weight:700}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (max-width:520px){
  .fld .lb{min-width:0;width:100%}
  .gas .bar{width:70px}
  .top .ttl{flex-basis:100%;order:-1}
  .eqbig{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<div id="top"></div>
<main class="wrap" id="app"></main>
<script>
"use strict";
/* =====================================================================
   LABORATORIO SELLADO · juego de escape de estequiometría
   Composición de la Materia · Lic. en Bioingeniería · Universidad Xochicalco
   Ajustes para docentes:
     DANO_GAS  exposición que suma cada error (%)
     PISTA_GAS exposición que suma pedir una pista antes de responder (%)
     ALIVIO    exposición que se descuenta al liberar una sala (%)
   Masas atómicas: mismas que las actividades T5 y T5b (2 decimales).
   ===================================================================== */
const DANO_GAS = 10, PISTA_GAS = 5, ALIVIO = 20, TOL = 0.01, TOL_SCI = 0.015;
const SAVE_KEY = "laboratorioSellado.v1";
const NA = 6.022e23, VM = 22.4;
const MASS = {H:1.01,C:12.01,N:14.01,O:16.00,Na:22.99,Mg:24.31,Al:26.98,P:30.97,S:32.07,Cl:35.45,K:39.10,Ca:40.08,Fe:55.85,Cu:63.55,Zn:65.38,Ag:107.87,Ba:137.33,Br:79.90};
const ELN = {H:"hidrógeno",C:"carbono",N:"nitrógeno",O:"oxígeno",Na:"sodio",Mg:"magnesio",Al:"aluminio",P:"fósforo",S:"azufre",Cl:"cloro",K:"potasio",Ca:"calcio",Fe:"hierro",Cu:"cobre",Zn:"zinc",Ag:"plata",Ba:"bario",Br:"bromo"};
const $ = id => document.getElementById(id);
const app = $("app");

/* ---------- utilidades ---------- */
function rng(seed){
  let a = seed >>> 0;
  const f = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  return {
    f, int:(x,y) => x + Math.floor(f()*(y-x+1)),
    real:(x,y,d) => +(x + f()*(y-x)).toFixed(d),
    pick:arr => arr[Math.floor(f()*arr.length)],
    shuffle:arr => { const z = arr.slice(); for (let i = z.length-1; i > 0; i--){ const j = Math.floor(f()*(i+1)); [z[i],z[j]] = [z[j],z[i]]; } return z; }
  };
}
const newSeed = () => (Math.random()*2**31) >>> 0;
const fx = f => f.replace(/(\d+)/g, "<sub>$1</sub>");
const ch = f => `<span class="chem">${fx(f)}</span>`;
const fmt = (x, d=2) => Number(x).toFixed(d);
const sig = (x, n=4) => +Number(x).toPrecision(n);
const sgs = (x, n=4) => { const v = sig(x,n); const a = Math.abs(v); return a >= 1e5 || (a > 0 && a < 1e-3) ? sci(v) : String(v); };
function sciParts(x){ if (!x) return [0,0]; let e = Math.floor(Math.log10(Math.abs(x))); let m = +(x/10**e).toFixed(3); if (Math.abs(m) >= 10){ m = +(m/10).toFixed(3); e++; } return [m,e]; }
const sci = x => { const [m,e] = sciParts(x); return `${m.toFixed(2)} × 10<sup>${e}</sup>`; };
const frac = (n,d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
function parse(f){
  let i = 0;
  const num = () => { const m = f.slice(i).match(/^\d+/); if (m){ i += m[0].length; return +m[0]; } return 1; };
  const group = () => {
    const c = {};
    while (i < f.length){
      if (f[i] === "("){ i++; const g = group(); i++; const n = num(); for (const k in g) c[k] = (c[k]||0) + g[k]*n; }
      else if (f[i] === ")") break;
      else { const m = f.slice(i).match(/^[A-Z][a-z]?/); i += m[0].length; const n = num(); c[m[0]] = (c[m[0]]||0) + n; }
    }
    return c;
  };
  return group();
}
const mm = f => Math.round(Object.entries(parse(f)).reduce((s,[e,n]) => s + n*MASS[e], 0)*100)/100;
function mmSol(f){
  const c = parse(f);
  return Object.entries(c).map(([e,n]) => `${e}: ${n} · ${fmt(MASS[e])} = ${fmt(n*MASS[e])}`).join("<br>") + `<br>PM(${fx(f)}) = <b>${fmt(mm(f))} g/mol</b>`;
}
/* ecuaciones: "2 H2 + O2 → 2 H2O" */
function eqObj(s){
  const side = t => t.trim().split(" + ").map(x => { const m = x.trim().match(/^(\d+)\s+(.+)$/); return m ? [+m[1], m[2]] : [1, x.trim()]; });
  const [l, r] = s.split("→");
  return {r:side(l), p:side(r)};
}
const term = ([c,f,st]) => `${c > 1 ? c + " " : ""}${fx(f)}${st ? `<span class="st">(${st})</span>` : ""}`;
const eqHTML = E => `<span class="chem">${E.r.map(term).join(" + ")} → ${E.p.map(term).join(" + ")}</span>`;
const eqStr = s => eqHTML(eqObj(s));
const coefOf = (E, f) => [...E.r, ...E.p].find(t => t[1] === f)[0];
/* factor unitario (notación de ingeniería), igual que en T5b */
function fac(start, factors, result){
  const nu = [start, ...factors.map(x => x[0])].map(x => `<td class="nu">${x}</td>`).join("");
  const de = ["", ...factors.map(x => x[1])].map(x => `<td class="de">${x}</td>`).join("");
  return `<div class="scroll"><table class="fac"><tr>${nu}<td rowspan="2" class="rs">= ${result}</td></tr><tr>${de}</tr></table></div>`;
}
function mc(R, correct, wrongs){
  const all = R.shuffle([correct, ...wrongs]);
  return {options: all, answer: all.indexOf(correct)};
}
const NUM = o => ({kind:"num", tries:2, ...o});
const CHO = o => ({kind:"choice", tries: o.options.length <= 2 ? 1 : 2, ...o});

const TYPES = ["Combinación (síntesis)", "Descomposición", "Combustión", "Desplazamiento simple", "Doble desplazamiento"];
const TYPE_EXPL = [
  "Dos o más sustancias forman un solo producto: A + B → AB.",
  "Una sola sustancia se separa en dos o más: AB → A + B.",
  "Una sustancia (generalmente un hidrocarburo) reacciona rápidamente con O₂; en la combustión completa se forman CO₂ y H₂O.",
  "Un elemento sustituye a otro dentro de un compuesto: A + BC → AC + B.",
  "Dos compuestos intercambian sus iones: AB + CD → AD + CB (incluye precipitación y neutralización)."
];
const TYPE_POOL = [
  ["N2 + 3 H2 → 2 NH3", "2 Mg + O2 → 2 MgO", "2 Na + Cl2 → 2 NaCl", "CaO + H2O → Ca(OH)2"],
  ["CaCO3 → CaO + CO2", "2 KClO3 → 2 KCl + 3 O2", "2 NaN3 → 2 Na + 3 N2", "2 H2O2 → 2 H2O + O2"],
  ["CH4 + 2 O2 → CO2 + 2 H2O", "C3H8 + 5 O2 → 3 CO2 + 4 H2O", "C2H5OH + 3 O2 → 2 CO2 + 3 H2O"],
  ["Zn + CuSO4 → ZnSO4 + Cu", "Fe + CuSO4 → FeSO4 + Cu", "Mg + 2 HCl → MgCl2 + H2"],
  ["NaCl + AgNO3 → AgCl + NaNO3", "HCl + NaOH → NaCl + H2O", "BaCl2 + Na2SO4 → BaSO4 + 2 NaCl"]
];
const STATES = {g:"gas", s:"sólido", l:"líquido", ac:"disolución acuosa"};

function typePuzzle(R, t){
  const e = R.pick(TYPE_POOL[t]);
  return CHO({title:"Frasco caído", text:`Un frasco roto tiene escrita esta reacción en la etiqueta:<div class="eqbig">${eqStr(e)}</div>¿Qué tipo de reacción es?`,
    options: TYPES, answer: t,
    hint:"Fíjate en el patrón: ¿cuántas sustancias hay de cada lado? ¿Participa O₂ con un compuesto de carbono? ¿Algún elemento queda libre?",
    sol:`${TYPES[t]}: ${TYPE_EXPL[t]}`});
}

{ name:"Esclusa de descontaminación", min:7,

  gen(R){

/* ---------- balanceo ---------- */
function counts(E, co){
  const L = {}, Rr = {};
  E.r.forEach((t,i) => { const c = parse(t[1]); for (const e in c) L[e] = (L[e]||0) + co[i]*c[e]; });
  E.p.forEach((t,i) => { const c = parse(t[1]); for (const e in c) Rr[e] = (Rr[e]||0) + co[E.r.length+i]*c[e]; });
  const els = [...new Set([...Object.keys(L), ...Object.keys(Rr)])];
  return els.map(e => [e, L[e]||0, Rr[e]||0]);
}
function balanceTable(E, co){
  co = co || [...E.r, ...E.p].map(t => t[0]);
  return `<table class="cnt"><tr><th>Elemento</th><th>Reactivos</th><th>Productos</th></tr>${counts(E, co).map(([e,l,r]) => `<tr class="${l===r?"eq":"ne"}"><td>${e}</td><td>${l}</td><td>${r}</td></tr>`).join("")}</table>`;
}
const gcd = (a,b) => b ? gcd(b, a % b) : a;

    freqs.forEach((f,i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; g.gain.value = vol;

}

function topBar(){
  const t = $("top");
  if (view === "title"){ t.innerHTML = ""; document.body.className = ""; return; }
  const g = S ? Math.round(S.gas) : 0;
  const k = RS ? `SALA ${RS.k+1}/${NR} · ${ROOMS[RS.k].name.toUpperCase()}${RS.review ? " · REPASO" : ""}` : "ESTACIÓN ALBACORA · NIVEL B-3";

    <button id="bMute" class="ghost" aria-label="Sonido">${muted ? "🔇" : "🔊"}</button></div></div>`;

}

const curRoom = () => S.done.indexOf(false);
function mapSVG(){
  const P = [[15,212],[145,212],[275,212],[275,112],[145,112],[15,112]];
  const cur = curRoom();
  const st = i => S.done[i] ? "done" : i === cur ? "cur" : "lock";
  const box = (i, x, y, w, h) => {
    const s = st(i), fill = s === "done" ? "#1b2a1e" : s === "cur" ? "#2a2310" : "#141718", stroke = s === "done" ? "#5d8b64" : s === "cur" ? "#e3a630" : "#353c3e";
    const icon = s === "done" ? "✔" : s === "cur" ? "▶" : "🔒";
    const words = ROOMS[i].name.split(" "), mid = Math.ceil(words.length/2);
    const l1 = words.slice(0, mid).join(" "), l2 = words.slice(mid).join(" ");
    return `<g class="rm ${s}" data-r="${i}" tabindex="${s === "lock" ? -1 : 0}" role="button" aria-label="Sala ${i+1}: ${ROOMS[i].name}">
      <rect class="r" x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>
      <text x="${x+8}" y="${y+16}" font-size="10" fill="${stroke}">SALA ${i+1}</text><text x="${x+w-8}" y="${y+16}" font-size="11" text-anchor="end">${icon}</text>
      <text x="${x+w/2}" y="${y+h/2+6}" font-size="10.5" text-anchor="middle" opacity="${s === "lock" ? .5 : 1}">${l1}</text>
      <text x="${x+w/2}" y="${y+h/2+19}" font-size="10.5" text-anchor="middle" opacity="${s === "lock" ? .5 : 1}">${l2}</text></g>`;
  };
  const cor = `<g stroke="#2f3638" stroke-width="8" fill="none" stroke-linecap="square">
    <path d="M125 244H145M255 244H275M330 212V176M275 144H255M145 144H125M70 112V78H80"/></g>`;
  return `<svg class="plan" viewBox="0 0 400 300" role="img" aria-label="Plano del nivel B-3">
    <rect x="2" y="2" width="396" height="296" rx="8" fill="#0e1112" stroke="#2f3638"/>
    ${cor}
    ${P.map(([x,y], i) => box(i, x, y, 110, 64)).join("")}
    ${box(6, 80, 14, 240, 64)}
    <text x="70" y="292" font-size="9" text-anchor="middle" fill="#8d9591">▲ ENTRADA</text>
    <text x="330" y="40" font-size="9" fill="#8d9591">SALIDA ▸</text>
  </svg>`;
}

      <div class="stats">Aciertos al primer intento: ${S.st.first} de ${S.st.total} · Errores: ${S.st.errors} · Pistas: ${S.st.hints}<br>Tiempo activo: ${mmss(S.active)}</div>

/* ---------- sala ---------- */
function enterRoom(k){
  const review = S.done[k];
  if (!review){
    if (S.room !== k){ S.room = k; S.pidx = 0; S.res = []; S.seeds[k] = newSeed(); }
    if (!S.seeds[k]) S.seeds[k] = newSeed();
    save();
  }
  const seed = review ? newSeed() : S.seeds[k];
  if (!review && S.pidx >= ROOMS[k].gen(rng(seed)).length){ RS = {k, review:false, puzzles:[]}; return roomDone(); }
  const puzzles = ROOMS[k].gen(rng(seed));
  RS = {k, review, puzzles, i: review ? 0 : Math.min(S.pidx, puzzles.length-1), res: review ? [] : S.res.slice(), tries:0, phase:"ask", hinted:false, lastInput:null, co:null};
  view = "room"; topBar(); renderRoom(true);
}
function renderRoom(first){
  const R = ROOMS[RS.k];
  const noteOpen = first && RS.i === 0;
  app.innerHTML = `<div class="roomhead"><div class="k">SALA ${RS.k+1} DE ${NR}${RS.review ? " · REPASO" : ""} · ~${R.min} MIN</div><h2>${R.name}</h2><p>${R.enter}</p></div>
  <div class="roomgrid" id="rg"><div><details class="note" ${noteOpen ? "open" : ""}><summary>Nota de la Dra. Valdivia</summary><div class="body">${R.note}</div></details>
    <div class="card puz" id="puz"></div></div><aside id="tools"></aside></div>`;
  renderPuzzle(); renderTools();
  if (first) scrollTo(0,0);
}
function renderPuzzle(){
  const p = RS.puzzles[RS.i], n = RS.puzzles.length;
  const dots = RS.puzzles.map((_,j) => `<i class="${RS.res[j] === true ? "ok" : RS.res[j] === false ? "ko" : j === RS.i ? "now" : ""}"></i>`).join("");
  let body = "";
  if (p.kind === "num"){
    body = `<div class="fields">${p.fields.map((f,j) => f.sci
      ? `<div class="fld"><span class="lb">${f.label}</span><span class="sci"><input class="m" data-f="${j}" data-part="m" inputmode="decimal" autocomplete="off" aria-label="${f.label}: coeficiente"> × 10<sup><input class="e" data-f="${j}" data-part="e" inputmode="numeric" autocomplete="off" aria-label="exponente"></sup></span><span class="un">${f.unit||""}</span></div>`
      : `<div class="fld"><span class="lb">${f.label}</span><input data-f="${j}" inputmode="${f.int ? "numeric" : "decimal"}" autocomplete="off"><span class="un">${f.unit||""}</span></div>`).join("")}</div>`;
  } else if (p.kind === "choice"){
    body = `<div class="opts">${p.options.map((o,j) => `<button data-o="${j}">${"ABCDE"[j]}) ${o}</button>`).join("")}</div>`;
  } else if (p.kind === "formula"){
    body = `<div class="fe">${p.els.map((e,j) => `<label>${e}<sub><input data-f="${j}" inputmode="numeric" autocomplete="off" aria-label="Subíndice de ${e}"></sub></label>`).join("")}</div>`;
  } else if (p.kind === "balance"){
    if (!RS.co) RS.co = [...p.E.r, ...p.E.p].map(() => 1);
    const nR = p.E.r.length;
    const spec = (t, j) => `<div class="sp"><button data-d="-1" data-j="${j}" aria-label="Restar">−</button><span class="co" id="co${j}">${RS.co[j]}</span><button data-d="1" data-j="${j}" aria-label="Sumar">+</button><span class="f">${fx(t[1])}</span></div>`;
    body = `<div class="bal"><div class="eqrow">${p.E.r.map((t,j) => spec(t,j)).join('<span class="op">+</span>')}<span class="op">→</span>${p.E.p.map((t,j) => spec(t, nR+j)).join('<span class="op">+</span>')}</div><div class="scroll" id="cnt">${balanceTable(p.E, RS.co)}</div></div>`;
  }
  const isNum = p.kind === "num" || p.kind === "formula";
  $("puz").innerHTML = `<div class="ph"><span>CERRADURA ${RS.i+1} DE ${n}</span><span class="dots">${dots}</span></div>
    <h3>${p.title}</h3><div class="ptext">${p.text}</div>${body}
    <div class="actions" id="acts">
      ${p.kind !== "choice" ? `<button class="pri" id="bChk">Comprobar</button>` : ""}
      <button id="bHint" ${RS.hinted ? "disabled" : ""}>💡 Pista${RS.review ? "" : ` (+${PISTA_GAS} %)`}</button>
      <button class="tool ${TOOLS.calc ? "on" : ""}" id="bCalc">🧮 Calculadora</button>
      <button class="tool ${TOOLS.table ? "on" : ""}" id="bTab">⚛ Tabla de masas</button>
    </div><div class="fb" id="fb">${RS.hinted ? `<div class="msg hint">💡 ${p.hint}</div>` : ""}</div>`;
  // eventos
  $("puz").querySelectorAll("input").forEach(inp => {
    inp.addEventListener("focus", () => RS.lastInput = inp);
    inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); check(); } });
  });
  $("puz").querySelectorAll(".opts button").forEach(b => b.onclick = () => check(+b.dataset.o));
  $("puz").querySelectorAll(".sp button").forEach(b => b.onclick = () => {
    if (RS.phase !== "ask") return;
    const j = +b.dataset.j; RS.co[j] = Math.max(1, Math.min(20, RS.co[j] + +b.dataset.d));
    $("co" + j).textContent = RS.co[j]; $("cnt").innerHTML = balanceTable(p.E, RS.co);
  });
  if ($("bChk")) $("bChk").onclick = () => check();
  $("bHint").onclick = () => { if (RS.hinted || RS.phase !== "ask") return; RS.hinted = true; if (!RS.review){ S.st.hints++; addGas(PISTA_GAS); } $("bHint").disabled = true; $("fb").insertAdjacentHTML("afterbegin", `<div class="msg hint">💡 ${p.hint}</div>`); };
  $("bCalc").onclick = () => toggleTool("calc");
  $("bTab").onclick = () => toggleTool("table");
  if (isNum && matchMedia("(pointer:fine)").matches){ const f = $("puz").querySelector("input"); if (f) f.focus({preventScroll:true}); }
}
function readNum(s){ s = String(s).trim().replace(/\s/g, "").replace(",", ".").replace(/^−/, "-"); if (!s) return NaN; return Number(s); }
function okVal(v, f){ if (f.int) return v === f.ans; const tol = f.tol ?? (f.sci ? TOL_SCI : TOL); return Math.abs(v - f.ans) <= Math.abs(f.ans)*tol + 1e-12; }
function shake(el){ el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

function check(choice){
  if (RS.phase !== "ask") return;
  const p = RS.puzzles[RS.i];
  let ok = false;
  if (p.kind === "num"){
    const vals = []; let bad = false;
    p.fields.forEach((f,j) => {
      if (f.sci){
        const m = $("puz").querySelector(`input[data-f="${j}"][data-part="m"]`), e = $("puz").querySelector(`input[data-f="${j}"][data-part="e"]`);
        const mv = readNum(m.value), ev = readNum(e.value);
        if (isNaN(mv) || isNaN(ev) || !Number.isInteger(ev)){ bad = true; shake(isNaN(mv) ? m : e); }
        vals.push([mv*10**ev, [m, e]]);
      } else {
        const inp = $("puz").querySelector(`input[data-f="${j}"]`), v = readNum(inp.value);
        if (isNaN(v)){ bad = true; shake(inp); }
        vals.push([v, [inp]]);
      }
    });
    if (bad) return fbFormat("Escribe un número en cada casilla (usa punto decimal).");
    ok = true;
    vals.forEach(([v, els], j) => { const good = okVal(v, p.fields[j]); ok = ok && good; els.forEach(el => { el.classList.toggle("good", good); el.classList.toggle("bad", !good); }); });
  } else if (p.kind === "formula"){
    const ins = [...$("puz").querySelectorAll(".fe input")];
    const vals = ins.map(i => i.value.trim() === "" ? NaN : readNum(i.value));
    if (vals.some(v => isNaN(v) || v < 1 || !Number.isInteger(v))){ ins.forEach(i => { if (isNaN(readNum(i.value))) shake(i); }); return fbFormat("Escribe un entero positivo en cada subíndice (1 si no lleva)."); }
    ok = vals.every((v,j) => v === p.ans[j]);
    ins.forEach((i,j) => { i.classList.toggle("good", vals[j] === p.ans[j]); i.classList.toggle("bad", vals[j] !== p.ans[j]); });
  } else if (p.kind === "choice"){
    ok = choice === p.answer;
    const b = $("puz").querySelector(`.opts button[data-o="${choice}"]`); b.classList.add(ok ? "sel-ok" : "sel-ko"); b.disabled = true;
  } else if (p.kind === "balance"){
    const bal = counts(p.E, RS.co).every(([,l,r]) => l === r), g = RS.co.reduce(gcd);
    if (bal && g > 1){ return fbFormat(`La ecuación está balanceada, pero los coeficientes no son los enteros más pequeños: todos se pueden dividir entre ${g}.`); }
    ok = bal;
  }
  if (ok) return resolve(true);
  RS.tries++;
  if (!RS.review){ S.st.errors++; addGas(DANO_GAS); }
  sfx.bad();
  if (S.gas >= 100 && !RS.review) return faint();
  if (RS.tries >= p.tries){ return resolve(false); }
  // primer error: pista
  const fb = $("fb");
  const pre = p.kind === "balance" ? "La tabla todavía no está equilibrada en todos los elementos." : "No es correcto.";
  fb.innerHTML = `<div class="msg ko">✘ ${pre} Te queda ${p.tries - RS.tries === 1 ? "1 intento" : (p.tries - RS.tries) + " intentos"}.${RS.review ? "" : ` Exposición +${DANO_GAS} %.`}</div>` + (RS.hinted ? "" : "") + `<div class="msg hint">💡 ${p.hint}</div>`;
  if (!RS.hinted){ RS.hinted = true; if (!RS.review) S.st.hints++; $("bHint").disabled = true; }
  save();
}
function fbFormat(m){ $("fb").innerHTML = `<div class="msg hint">${m}</div>` + (RS.hinted ? `<div class="msg hint">💡 ${RS.puzzles[RS.i].hint}</div>` : ""); }
function resolve(ok){
  const p = RS.puzzles[RS.i];
  RS.phase = "done"; RS.res[RS.i] = ok;
  if (!RS.review){ S.st.total++; if (ok && RS.tries === 0) S.st.first++; S.res = RS.res.slice(); }
  ok ? sfx.ok() : 0;
  $("puz").querySelectorAll("input, .opts button, .sp button").forEach(el => el.disabled = true);
  if (p.kind === "choice" && !ok){ const c = $("puz").querySelector(`.opts button[data-o="${p.answer}"]`); c.classList.add("sel-ok"); }
  if ($("bChk")) $("bChk").disabled = true;
  $("bHint").disabled = true;
  const last = RS.i === RS.puzzles.length - 1;
  $("fb").innerHTML = (ok ? `<div class="msg ok">✔ Correcto. La cerradura cede.</div>` : `<div class="msg ko">✘ Se agotaron los intentos. SELLO muestra el procedimiento correcto y te deja avanzar; revísalo con calma.</div>`) +
    `<div class="sol">${p.sol}</div><div class="actions"><button class="pri" id="bNext">${last ? "Liberar la sala ▶" : "Siguiente cerradura ▶"}</button></div>`;
  // marca el punto
  const d = $("puz").querySelectorAll(".dots i")[RS.i]; if (d){ d.className = ok ? "ok" : "ko"; }
  $("bNext").onclick = next;
  if (!RS.review){ S.pidx = RS.i + 1; }
  save();
  $("fb").scrollIntoView({block:"nearest", behavior:"smooth"});
}
function next(){
  if (RS.i < RS.puzzles.length - 1){
    RS.i++; RS.tries = 0; RS.phase = "ask"; RS.hinted = false; RS.co = null; RS.lastInput = null;
    renderPuzzle(); $("puz").scrollIntoView({block:"start", behavior:"smooth"});
  } else roomDone();
}
function addGas(x){ S.gas = Math.max(0, Math.min(100, S.gas + x)); S.gasMax = Math.max(S.gasMax, S.gas); topBar(); }
function faint(){
  sfx.faint(); S.st.faints++;
  const k = RS.k; S.gas = 40; S.pidx = 0; S.res = []; S.seeds[k] = newSeed(); save();
  RS = null; closeTools(); view = "event"; topBar();
  app.innerHTML = `<section class="event faint"><div class="big">EXPOSICIÓN 100 %</div>
    <p>La vista se nubla y caes sobre el piso frío. Despiertas en la entrada de la ${ROOMS[k].name.toLowerCase()} con el filtro recargado a medias (exposición 40 %).</p>
    <p>Las cerraduras se reiniciaron con datos nuevos. Lee otra vez la nota de la Dra. Valdivia y usa las pistas.</p>
    <div class="row" style="justify-content:center"><button class="pri" id="bRe">Volver a intentarlo</button><button id="bM">Ir al mapa</button></div></section>`;
  $("bRe").onclick = () => enterRoom(k); $("bM").onclick = showMap; scrollTo(0,0);
}
function roomDone(){
  const k = RS.k, review = RS.review, R = ROOMS[k];
  closeTools();
  if (review){ RS = null; showMap(); return; }
  S.done[k] = true; S.room = -1; S.pidx = 0; S.res = []; S.gas = Math.max(0, S.gas - ALIVIO); save();
  sfx.door(); RS = null;
  if (k === NR - 1){ S.finished = true; save(); return showEnd(); }
  view = "event"; topBar();
  app.innerHTML = `<section class="event"><div class="big">SELLO ${k+1} LIBERADO</div><p>${R.exit}</p>
    <p class="small">Encuentras un cartucho de filtro: exposición −${ALIVIO} %.</p>
    <div class="row" style="justify-content:center"><button class="pri" id="bM">Volver al mapa</button></div></section>`;
  $("bM").onclick = showMap; scrollTo(0,0);
}
function showEnd(){
  view = "end"; RS = null; topBar();
  const st = S.st, pctOk = st.total ? Math.round(st.first/st.total*100) : 0;
  const date = new Date().toLocaleDateString("es-MX", {day:"numeric", month:"long", year:"numeric"});
  app.innerHTML = `<section class="event"><div class="big">SALIDA DESBLOQUEADA</div>
    <p>La dosis está lista. SELLO reconoce el antídoto, ventila el nivel y abre la salida. Subes las escaleras de emergencia mientras amanece sobre la estación.</p></section>
    <section class="report"><h2>INFORME DE EVACUACIÓN</h2><div>Estación Albacora · Nivel B-3 · ${date}</div>
    <table>
      <tr><td>Nombre</td><td>${esc(S.name)}</td></tr>
      <tr><td>Salas liberadas</td><td>${S.done.filter(Boolean).length} de ${NR}</td></tr>
      <tr><td>Aciertos al primer intento</td><td>${st.first} de ${st.total} (${pctOk} %)</td></tr>
      <tr><td>Errores</td><td>${st.errors}</td></tr>
      <tr><td>Pistas usadas</td><td>${st.hints}</td></tr>
      <tr><td>Desmayos</td><td>${st.faints}</td></tr>
      <tr><td>Exposición máxima</td><td>${Math.round(S.gasMax)} %</td></tr>
      <tr><td>Tiempo activo</td><td>${mmss(S.active)}</td></tr>
    </table>
    <div style="font-size:.85rem">Toma una captura de este informe si tu docente la solicita.</div></section>
    <div class="row" style="justify-content:center;margin:10px 0 30px"><button id="bMap2">Repasar salas en el mapa</button><button class="danger" id="bNew">↺ Nueva partida</button></div>`;
  $("bMap2").onclick = showMap;
  $("bNew").onclick = () => { try { localStorage.removeItem(SAVE_KEY); } catch(e){} S = null; showTitle(); };
  scrollTo(0,0);
}

/* =====================================================================
   HERRAMIENTAS: calculadora y tabla (solo visibles al tocarlas; nunca flotan sobre el reto)
   ===================================================================== */
function closeTools(){ TOOLS.calc = false; TOOLS.table = false; }
const wide = () => matchMedia("(min-width:900px)").matches;
function toggleTool(t){
  TOOLS[t] = !TOOLS[t]; renderTools();
  $("bCalc").classList.toggle("on", TOOLS.calc); $("bTab").classList.toggle("on", TOOLS.table);
  if (TOOLS[t] && !wide()){ const el = $(t === "calc" ? "calcP" : "tabP"); if (el) el.scrollIntoView({block:"start", behavior:"smooth"}); }
}
function roomElements(){
  const s = new Set();
  const txt = RS.puzzles.map(p => p.text + " " + (p.E ? [...p.E.r, ...p.E.p].map(t => t[1]).join(" ") : "") + " " + (p.els ? p.els.join(" ") : "")).join(" ")
    .replace(/<sub>(\d+)<\/sub>/g, "$1").replace(/<[^>]+>/g, " ");
  txt.split(/[\s.,;:¿?¡!«»"'·\/=+→×%−\-]+/).forEach(w => {
    if (!/^([A-Z][a-z]?\d*|\(|\)|\d)+$/.test(w)) return;
    const els = w.match(/[A-Z][a-z]?/g) || [];
    if (els.length && els.every(e => MASS[e])) els.forEach(e => s.add(e));
  });
  return Object.keys(MASS).filter(e => s.has(e));
}
function renderTools(){
  const a = $("tools"); if (!a) return;
  $("rg").classList.toggle("tools-on", TOOLS.calc || TOOLS.table);
  let h = "";
  if (TOOLS.calc) h += `<div class="tool-panel" id="calcP"><div class="th"><span>🧮 CALCULADORA</span><button id="xCalc">✕ Cerrar</button></div>${calcHTML()}</div>`;
  if (TOOLS.table){
    const els = roomElements(), list = els.length ? els : Object.keys(MASS);
    h += `<div class="tool-panel" id="tabP"><div class="th"><span>⚛ MASAS ATÓMICAS (g/mol)</span><button id="xTab">✕ Cerrar</button></div>
      <div class="ptab">${list.map(e => `<div><b>${e}</b><span>${fmt(MASS[e])}</span><small>${ELN[e]}</small></div>`).join("")}</div>
      <div class="small" style="margin-top:6px">N<sub>A</sub> = 6.022 × 10<sup>23</sup> mol<sup>−1</sup> · V<sub>m</sub> (CN) = 22.4 L/mol</div></div>`;
  }
  a.innerHTML = h;
  if (TOOLS.calc){ a.querySelectorAll(".ckeys button").forEach(b => b.onclick = () => calcPress(b.dataset.k)); calcShow(); $("xCalc").onclick = () => toggleTool("calc"); }
  if (TOOLS.table) $("xTab").onclick = () => toggleTool("table");
}
const CALC = {t:[], fresh:false, ans:0};
const CKEYS = [
  ["C","del"],["⌫","del"],["(","op"],[")","op"],["÷","op"],
  ["7"],["8"],["9"],["EXP","op"],["×","op"],
  ["4"],["5"],["6"],["xʸ","op"],["−","op"],
  ["1"],["2"],["3"],["Ans","op"],["+","op"],
  ["0"],["."],["Nₐ","op"],["=","eq"]
];
const CMAP = {"÷":["÷","/"], "×":["×","*"], "−":["−","-"], "+":["+","+"], "xʸ":["^","^"], "(":["(","("], ")":[")",")"], "EXP":["×10^","E"], "Ans":["Ans","A"], "Nₐ":["Nₐ","N"]};
function calcHTML(){
  return `<div class="cdisp"><div class="cexpr" id="cexpr"></div><div class="cres" id="cres"></div></div>
    <div class="ckeys">${CKEYS.map(([k,c]) => `<button type="button" data-k="${k}" class="${c||""}">${k === "Nₐ" ? "N<sub>A</sub>" : k}</button>`).join("")}
    <button type="button" data-k="use" class="use">➜ Usar el resultado en la casilla activa</button></div>
    <div class="small" style="margin-top:6px">6.022 × 10²³ se escribe <b>6.022 EXP 23</b>. En computadora también puedes usar el teclado.</div>`;
}
function calcEval(){
  let s = CALC.t.map(x => x.e).join("");
  const open = (s.match(/\(/g)||[]).length - (s.match(/\)/g)||[]).length; s += ")".repeat(Math.max(0, open));
  const A = `(${CALC.ans.toExponential()})`, N = "(6.022e23)";
  s = s.replace(/(\d|\)|A|N)(?=[AN(])/g, "$1*").replace(/\)(?=\d)/g, ")*");   // multiplicación implícita
  s = s.replace(/A/g, A).replace(/N/g, N).replace(/(\d|\.)E/g, "$1e").replace(/E/g, "1e").replace(/\^/g, "**");
  if (!/^[0-9+\-*/().e\s]*$/.test(s)) throw 0;
  const v = Function(`"use strict";return (${s});`)();
  if (typeof v !== "number" || !isFinite(v)) throw 0;
  return v;
}
const calcValue = () => { try { return calcEval(); } catch(e){ return null; } };
function calcFmt(v){ const a = Math.abs(v); if (a !== 0 && (a >= 1e6 || a < 1e-3)){ const [m,e] = sciParts(v); return `${+m.toFixed(4)}×10^${e}`; } return String(+v.toPrecision(10)); }
function calcShow(msg){
  const ex = $("cexpr"), rs = $("cres"); if (!ex) return;
  ex.textContent = CALC.t.map(x => x.d).join("") || "0";
  const v = CALC.t.length ? calcValue() : null;
  rs.textContent = msg || (v === null ? (CALC.t.length ? "…" : "") : "= " + calcFmt(v));
}
function calcPress(k){
  if (k === "C"){ CALC.t = []; CALC.fresh = false; }
  else if (k === "⌫"){ CALC.t.pop(); CALC.fresh = false; }
  else if (k === "="){
    const v = calcValue(); if (v === null) return calcShow("Revisa la operación");
    CALC.ans = v; CALC.t = [{d:calcFmt(v), e:"A"}]; CALC.fresh = true;
  } else if (k === "use"){
    const v = CALC.t.length ? calcValue() : null; if (v === null) return calcShow("Primero escribe una operación");
    CALC.ans = v; return useResult(v);
  } else {
    const isNum = /^[0-9.]$/.test(k);
    if (CALC.fresh && (isNum || k === "(" || k === "Nₐ")) CALC.t = [];
    CALC.fresh = false;
    const [d, e] = isNum ? [k, k] : CMAP[k];
    CALC.t.push({d, e});
  }
  calcShow();
}
function useResult(v){
  if (!RS || RS.phase !== "ask") return calcShow("No hay casilla activa");
  let inp = RS.lastInput && RS.lastInput.isConnected ? RS.lastInput : null;
  if (!inp) inp = [...$("puz").querySelectorAll("input")].find(i => !i.value.trim() && !i.disabled) || $("puz").querySelector("input");
  if (!inp) return calcShow("Este reto no lleva casilla");
  if (inp.dataset.part){
    const j = inp.dataset.f, [m, e] = sciParts(v);
    $("puz").querySelector(`input[data-f="${j}"][data-part="m"]`).value = +m.toFixed(4);
    $("puz").querySelector(`input[data-f="${j}"][data-part="e"]`).value = e;
  } else inp.value = Math.abs(v) >= 1e6 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(4) : String(+v.toFixed(4));
  inp.classList.remove("good","bad");
  calcShow("✓ Copiado a la casilla");
  if (!wide()){ TOOLS.calc = false; renderTools(); $("bCalc").classList.remove("on"); }
  inp.scrollIntoView({block:"center", behavior:"smooth"});
}
addEventListener("keydown", e => {
  if (!TOOLS.calc || view !== "room" || (document.activeElement && document.activeElement.tagName === "INPUT")) return;
  const map = {"/":"÷","*":"×","-":"−","+":"+","^":"xʸ","(":"(",")":")","Enter":"=","=":"=","Backspace":"⌫","Escape":"C","e":"EXP","E":"EXP"};
  const k = /^[0-9.]$/.test(e.key) ? e.key : map[e.key];
  if (k){ e.preventDefault(); calcPress(k); }
});

/* ---------- inicio ---------- */
window.LAB = { get S(){ return S; }, get RS(){ return RS; }, ROOMS, mm, parse };
showTitle();
